<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Smiley · מחלקת גבייה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2}
*{box-sizing:border-box}body{margin:0;font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:20px;margin:0}header .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list{max-height:calc(100vh - 250px);overflow:auto;padding:0}
.row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f3f4f6}.row.sel{background:#eef2ff}.row .n{flex:1;min-width:0}.row .n small{display:block;color:var(--mute)}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:#eef0f3;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input,.tools select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tools input{flex:1;min-width:160px}
h2{font-size:18px;margin:0 0 4px}h3{font-size:15px;margin:16px 0 6px}
.mute{color:var(--mute)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.order{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}
.msg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:#fafafa}
.msg pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;font-size:14px}
.msg summary{cursor:pointer;font-weight:500}
form.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}form.st textarea{grid-column:1/-1;min-height:60px}form.st label{display:flex;gap:6px;align-items:center}form.st label input{width:auto}
form.st select,form.st input,form.st textarea{padding:8px;border:1px solid var(--line);border-radius:8px;width:100%}
.ev{font-size:13px;border-right:3px solid var(--line);padding:4px 10px;margin:6px 0;white-space:pre-wrap}
.ev.pay{border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
.login{max-width:360px;margin:12vh auto}.login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;bottom:16px;left:16px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login card hide">
    <h2>מחלקת גבייה · Smiley</h2>
    <input id="em" type="email" placeholder="אימייל" autocomplete="username">
    <input id="pw" type="password" placeholder="סיסמה" autocomplete="current-password">
    <button class="btn p" id="go" style="width:100%;justify-content:center;margin-top:6px">כניסה</button>
    <p id="lerr" class="mute"></p>
  </div>

  <div id="app" class="hide">
    <header>
      <h1>מחלקת גבייה · Smiley</h1>
      <div class="tabs">
        <button class="tab on" data-v="queue">לטיפול היום</button>
        <button class="tab" data-v="all">כל התיקים</button>
        <button class="tab" data-v="pay">עמלות ושכר</button>
      </div>
      <span class="sp"></span><span id="who" class="mute"></span><button class="btn" id="out">יציאה</button>
    </header>
    <div id="banner" class="card hide" style="background:var(--warnbg);border-color:#fcd34d;margin-bottom:10px">מצב עובד: זה מה שהעובד רואה. שינויים שתעשה כאן נשמרים בתיקים, אבל לא נספרים לו לעמלה.</div>
    <div class="kpis" id="kpis"></div>

    <div id="vCases" class="grid">
      <div class="card list">
        <div class="tools" style="padding:12px 12px 0">
          <input id="q" placeholder="חיפוש: שם / טלפון / הזמנה">
          <select id="fs"><option value="">כל הסטטוסים</option></select>
        </div>
        <div id="rows"></div>
      </div>
      <div class="card" id="det"><p class="mute">בחר/י תיק מהרשימה.</p></div>
    </div>

    <div id="vPay" class="card hide"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB = supabase.createClient("https://tlxuqxlqzcpelcfdtjax.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRseHVxeGxxemNwZWxjZmR0amF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDUzNDcsImV4cCI6MjA5NTg4MTM0N30.M_Pe6uLqhh_cj8SzPLTMJA9VtjFT0h1dWNmLc_WZxCs");
const STATUSES = ["חדש","נשלחה הודעה","בתהליך","בוצע – ממתין לאימות","נשלח מכתב התראה","סגור"];
const DONE = "בוצע – ממתין לאימות";
const CONSENT_IMG = "https://cdn.shopify.com/s/files/1/0638/7816/8733/files/WhatsApp_Image_2026-10-27_at_01.43.26.jpg?v=1793091924";
let ME = null, ADMIN = false, AGENT_VIEW = false, CASES = [], PAYS = [], PAYOUTS = [], VIEW = "queue", SEL = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ils = n => "₪" + Number(n || 0).toLocaleString("he-IL", {minimumFractionDigits: 0, maximumFractionDigits: 2});
const today = () => new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Jerusalem"}));
const dmy = d => d.toLocaleDateString("he-IL", {day: "2-digit", month: "2-digit", year: "numeric"});
const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const plus = n => { const d = today(); d.setDate(d.getDate() + n); return dmy(d); };
const days = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : 999;
const local = p => p ? "0" + p.slice(3) : "";
const isPaid = c => Number(c.paid_amount || 0) * 100 >= c.amount - 1;
const boss = () => ADMIN && !AGENT_VIEW;
const ls = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } };
function toast(t){ const e = $("#toast"); e.textContent = t; e.style.display = "block"; setTimeout(() => e.style.display = "none", 2200); }

// ---------- auth ----------
async function start(){
  const { data } = await SB.auth.getSession();
  if (!data.session){ $("#login").classList.remove("hide"); return; }
  ME = data.session.user.email; $("#who").textContent = ME;
  const a = await SB.from("coll_admins").select("email").eq("email", ME); ADMIN = !!(a.data && a.data.length);
  $("#app").classList.remove("hide"); $("#login").classList.add("hide");
  if (ADMIN){
    AGENT_VIEW = ls("agentView") === "1";
    $("#who").insertAdjacentHTML("beforebegin", `<button class="btn" id="av"></button>`);
    $("#av").onclick = () => { AGENT_VIEW = !AGENT_VIEW; ls("agentView", AGENT_VIEW ? "1" : "0"); mode(); render(); };
  }
  mode();
  STATUSES.forEach(s => $("#fs").insertAdjacentHTML("beforeend", `<option>${s}</option>`));
  await load();
}
function mode(){
  $("#banner").classList.toggle("hide", !(ADMIN && AGENT_VIEW));
  if ($("#av")) $("#av").textContent = AGENT_VIEW ? "חזרה למצב מנהל" : "מצב עובד";
}
$("#go").onclick = async () => {
  const { error } = await SB.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
  if (error) $("#lerr").textContent = "פרטי הכניסה שגויים"; else location.reload();
};
$("#pw").addEventListener("keydown", e => e.key === "Enter" && $("#go").click());
$("#out").onclick = async () => { await SB.auth.signOut(); location.reload(); };

async function load(){
  const [c, p, o] = await Promise.all([
    SB.from("coll_cases").select("*").eq("removed", false).order("latest", {ascending: false}),
    SB.from("coll_payments").select("*").order("paid_at", {ascending: false}),
    SB.from("coll_payouts").select("*")]);
  CASES = (c.data || []).filter(x => !isPaid(x));            // paid and verified = gone from the desk
  PAYS = p.data || []; PAYOUTS = o.data || [];
  kpis(); render();
}

// ---------- what to do next (written channel only: WhatsApp) ----------
// day 0 first message -> day 3 reminder -> day 8 (or a refusal) letter -> 11 days after the letter final reminder -> closed
function next(c){
  const from = days(c.agent_touched_at), last = days(c.last_action_at);
  switch (c.status){
    case "חדש": return "לשלוח פנייה ראשונה";
    case "נשלחה הודעה":
      if (from >= 8) return "לשלוח מכתב התראה";
      if (from >= 3 && last >= 3) return "לשלוח תזכורת";
      return null;
    case "בתהליך": return last >= 2 ? "מעקב: לשלוח שוב את הקישור" : null;
    case DONE: return days(c.done_at) >= 1 ? "לא נמצא תשלום: לבקש מהלקוח צילום אישור" : null;
    case "נשלח מכתב התראה": return last >= 11 ? "תזכורת אחרונה, ואז לסגור" : null;
  }
  return null;
}
function kpis(){
  const m = ym(today()), mine = PAYS.filter(p => p.month === m && p.commissionable);
  $("#kpis").innerHTML = [
    ["לטיפול היום", CASES.filter(next).length],
    ["תיקים פתוחים", CASES.filter(c => c.status !== "סגור").length + " · " + ils(CASES.filter(c => c.status !== "סגור").reduce((s, c) => s + c.amount / 100, 0))],
    ["נגבה החודש", ils(mine.reduce((s, p) => s + p.amount - p.refunded, 0))],
    ["עמלה החודש (20%)", ils(mine.reduce((s, p) => s + Number(p.commission), 0))],
  ].map(([t, v]) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join("");
}
function chip(c){
  if (c.status === DONE) return days(c.done_at) >= 1 ? `<span class="chip bad">לא נמצא תשלום</span>` : `<span class="chip warn">ממתין לאימות</span>`;
  return `<span class="chip ${c.status === "סגור" ? "" : c.status === "נשלח מכתב התראה" ? "bad" : ""}">${esc(c.status)}</span>`;
}
function render(){
  $("#vCases").classList.toggle("hide", VIEW === "pay"); $("#vPay").classList.toggle("hide", VIEW !== "pay");
  if (VIEW === "pay") return payroll();
  const q = $("#q").value.trim().toLowerCase(), fs = $("#fs").value;
  let list = VIEW === "queue" ? CASES.filter(next) : CASES;
  if (fs) list = list.filter(c => c.status === fs);
  if (q) list = list.filter(c => [c.name, c.phone, local(c.phone), c.orders_label, c.email].join(" ").toLowerCase().includes(q));
  if (VIEW === "queue"){                                        // follow-ups first, then new cases (newest disputes first)
    const rank = c => c.status === "חדש" ? 1 : 0;
    list = [...list].sort((a, b) => rank(a) - rank(b) || (b.latest || "").localeCompare(a.latest || ""));
  }
  $("#rows").innerHTML = list.length ? list.map(c => `
    <div class="row ${SEL === c.phone ? "sel" : ""}" data-p="${c.phone}">
      <div class="n"><b>${esc(c.name)}</b><small>${esc(c.total)} · ${esc(c.case_type)}${next(c) ? " · " + next(c) : ""}</small></div>${chip(c)}
    </div>`).join("") : `<p class="mute" style="padding:14px">אין תיקים כאן.</p>`;
  document.querySelectorAll(".row").forEach(r => r.onclick = () => openCase(r.dataset.p));
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); t.classList.add("on"); VIEW = t.dataset.v; render();
});
$("#q").oninput = render; $("#fs").onchange = render;

// ---------- ready messages (same wording as the guide PDF) ----------
function msgs(c){
  const n = c.first_name || "", ord = (c.orders_label.includes(",") ? "הזמנות " : "הזמנה ") + c.orders_label, link = c.payment_link, d7 = plus(7), d14 = plus(14);
  const mid = c.variant === "fraud"
    ? `המוצרים בהזמנה (${ord}) נשלחו לכתובת שנמסרה בהזמנה. התשלום עליהם, בסך ${c.total}, בוטל דרך חברת האשראי של בעל הכרטיס, והסכום עדיין לא שולם.`
    : `המוצרים שהזמנת (${ord}) נשלחו${c.variant === "delivered" ? " ונמסרו" : ""} לכתובתך. התשלום עליהם, בסך ${c.total}, בוטל דרך חברת האשראי, והסכום עדיין לא שולם.`;
  const ship = (c.orders || []).flatMap(o => o.shipments.map(s => `הזמנה ${o.order}: ${s.carrier} ${s.tracking} · ${s.status}${s.date ? " · " + s.date : ""}\n${s.tracking_url}`)).join("\n");
  const steps = [
    ["1. פנייה ראשונה", "נשלחה הודעה", `שלום ${n},\nזו פנייה רשמית של מחלקת הכספים של Smiley בנוגע לחוב פתוח על שמך.\n${mid}\nיש להסדיר את מלוא הסכום עד ${d7} בקישור האישי שלמטה.\nאם החוב לא יוסדר עד המועד הזה, הטיפול בו יעבור לשלב הבא.\nאם יש לך טענה לגבי החיוב, אפשר להשיב להודעה הזו.\n${link}`],
    ["2. תזכורת (יום 3)", "נשלחה הודעה", `שלום ${n},\nתזכורת: החוב בסך ${c.total} בגין ${ord} עדיין לא הוסדר.\nלאחר המועד שנקבע יישלח אליך מכתב התראה רשמי.\nניתן להסדיר את החוב בקישור האישי:\n${link}`],
    ["3. מכתב התראה (יום 8, או מיד אחרי סירוב) · לצרף את ה-PDF", "נשלח מכתב התראה", `שלום ${n},\nהחוב בסך ${c.total} טרם הוסדר.\nמצורף מכתב התראה רשמי בנוגע לחוב. יש לעיין בו.\nניתן להסדיר את מלוא החוב עד ${d14} בקישור האישי שלמטה. לאחר מועד זה נפעל כמפורט במכתב.\n${link}`],
    ["4. תזכורת אחרונה (11 ימים אחרי המכתב)", "סגור", `שלום ${n},\nנותרו 3 ימים למועד האחרון שנקבע במכתב ההתראה.\nהחוב בסך ${c.total} עדיין פתוח. לאחר מועד זה לא תישלח פנייה נוספת.\nניתן להסדיר את החוב בקישור האישי:\n${link}`],
  ];
  const replies = [
    ["הסכים לשלם / שאל איך", `מלוא החוב (${c.total}) ניתן לתשלום בקישור האישי שלהלן, דף תשלום מאובטח של Stripe (כרטיס אשראי, ולרוב גם Apple Pay ו-Google Pay). עם התשלום יישלח אישור למייל, והתיק ייסגר.\n${link}`],
    ["\"מי אתם? זה עוקץ?\"", `זו מחלקת הכספים של Smiley, האתר try-smiley.com. ההזמנה (${ord}) בוצעה עם מספר הטלפון הזה ונשלחה לכתובת ${c.address || ""}. התשלום עליה בוטל דרך חברת האשראי. הקישור הוא דף תשלום מאובטח של Stripe בסכום החוב, ${c.total}.\n${link}`],
    ["\"לא קיבלתי\"", `לפי התיעוד שלנו:\n${ship}\nביטול החיוב דרך חברת האשראי אינו הדרך לבירור משלוח. החוב בסך ${c.total} פתוח.\n${link}`],
    ["\"כבר שילמתי\"", `לא התקבל תשלום בקישור האישי. אם שולם בדרך אחרת, יש לשלוח כאן צילום של אישור התשלום. עד אז התיק פתוח.\n${link}`],
    ["הנחה / תשלומים / \"אין לי\"", `לא ניתן להסדיר את החוב בהנחה או בתשלומים. הסכום לתשלום הוא ${c.total}, בקישור האישי:\n${link}`],
    ["\"תתבעו אותי\" / סירוב", `הודעתך נרשמה. החוב בסך ${c.total} פתוח, ויישלח אלייך מכתב התראה רשמי לפני נקיטת הליכים. עד אז עדיין ניתן להסדיר את החוב בקישור:\n${link}`],
  ];
  if (c.kind === "sub") replies.splice(2, 0, ["\"לא ידעתי שזה מנוי\" (לשלוח קודם את התמונה)", `ההצטרפות למנוי הוצגה באתר בארבעה מקומות: בדף המוצר, בעגלה, בסיכום ההזמנה ומעל כפתור התשלום, עם נוסח הסכמה מפורש לחיוב אוטומטי. ניתן היה לבחור במקום זה רכישה חד־פעמית.\nהמשלוחים יצאו אליך, והחוב הוא רק עליהם. ביטול מנוי מונע חיובים עתידיים בלבד, ואינו מבטל תשלום על משלוחים שכבר סופקו. המנוי כבר הופסק ולא יהיו חיובים נוספים.\n${link}`, CONSENT_IMG]);
  return { steps, replies };
}
const wa = (phone, text) => `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

// ---------- case panel ----------
async function openCase(phone){
  SEL = phone; render();
  const c = CASES.find(x => x.phone === phone);
  const [ev, url] = await Promise.all([
    SB.from("coll_events").select("*").eq("phone", phone).order("at", {ascending: false}),
    c.letter_path ? SB.storage.from("coll-letters").createSignedUrl(c.letter_path, 3600) : Promise.resolve({data: null})]);
  const { steps, replies } = msgs(c), todo = next(c);
  $("#det").innerHTML = `
    <h2>${esc(c.name)} ${chip(c)}</h2>
    <div class="mute">${esc(c.case_type)} · <b>${esc(c.total)}</b> · ${esc(local(c.phone))} · ${esc(c.email)}</div>
    ${todo ? `<div class="card" style="background:#eef4ff;border-color:#c7d7fe;margin-top:10px"><b>הצעד הבא:</b> ${todo}</div>` : ""}
    <h3>סטטוס</h3>
    <div class="btns">${STATUSES.filter(s => s !== "חדש").map(s => `<button class="btn ${s === c.status ? "p" : ""}" data-st="${s}">${s}</button>`).join("")}</div>

    <h3>הודעות לפי הסדר</h3>
    ${steps.map(([t, st, b]) => `<details class="msg" ${todo && t.length && ((c.status === "חדש" && t.startsWith("1")) || (todo.includes("תזכורת") && !todo.includes("אחרונה") && t.startsWith("2")) || (todo.includes("מכתב") && t.startsWith("3")) || (todo.includes("אחרונה") && t.startsWith("4"))) ? "open" : ""}>
      <summary>${esc(t)}</summary><pre>${esc(b)}</pre>
      <a class="btn p" href="${wa(phone, b)}" target="_blank" data-after="${st}">פתח בוואטסאפ</a> <button class="btn" data-copy="${esc(b)}">העתק</button>
      ${t.startsWith("3") ? (url.data ? `<a class="btn" href="${url.data.signedUrl}" target="_blank">הורד מכתב PDF</a>` : `<span class="chip">מכתב בהכנה</span>`) : ""}</details>`).join("")}

    <h3>תשובות לטענות</h3>
    ${replies.map(([t, b, img]) => `<details class="msg"><summary>${esc(t)}</summary>${img ? `<p><a href="${img}" target="_blank">התמונה לשליחה</a></p>` : ""}<pre>${esc(b)}</pre>
      <a class="btn p" href="${wa(phone, b)}" target="_blank" data-after="בתהליך">פתח בוואטסאפ</a> <button class="btn" data-copy="${esc(b)}">העתק</button></details>`).join("")}

    <h3>הזמנות ומשלוחים</h3>
    ${(c.orders || []).map(o => `<div class="order"><b>${esc(o.order)}</b> · ${esc(o.order_date)} · ${esc(o.amount)}<br><span class="mute">${esc(o.products)}</span>
      ${o.shipments.map(s => `<br>${esc(s.carrier)} ${esc(s.tracking)} · <b>${esc(s.status)}</b>${s.date ? " · " + esc(s.date) : ""} · <a href="${s.tracking_url}" target="_blank">מעקב</a>`).join("")}</div>`).join("")}
    <div class="mute" style="font-size:13px">${esc(c.address || "")}</div>

    <h3>היסטוריה</h3>
    ${(ev.data || []).map(e => `<div class="ev ${e.status.startsWith("שולם") ? "pay" : ""}"><b>${esc(e.status)}</b> · ${new Date(e.at).toLocaleString("he-IL")}${e.note ? "\n" + esc(e.note) : ""}</div>`).join("") || `<p class="mute">אין עדיין.</p>`}`;
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.copy); toast("הועתק"); });
  const save = async st => {
    const { error } = await SB.rpc("coll_set_status", { p_phone: phone, p_status: st });
    if (error) return toast("שגיאה: " + error.message);
    toast("סטטוס: " + st); await load(); if (CASES.find(x => x.phone === phone)) openCase(phone);
  };
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => save(b.dataset.st));
  // sending a step from here also moves the status (a reply only moves a new case to "in progress")
  document.querySelectorAll("[data-after]").forEach(b => b.addEventListener("click", () => {
    const st = b.dataset.after;
    if (st === "בתהליך" ? c.status === "חדש" || c.status === "נשלחה הודעה" : true) save(st);
  }));
}

// ---------- payroll ----------
function payroll(){
  const months = [...new Set(PAYS.filter(p => p.commissionable).map(p => p.month))].sort().reverse();
  const cur = ym(today());
  if (!months.includes(cur)) months.unshift(cur);
  const rows = months.map(m => {
    const ps = PAYS.filter(p => p.month === m && p.commissionable), po = PAYOUTS.find(o => o.month === m);
    const [y, mo] = m.split("-").map(Number), pay = new Date(y, mo, 10);
    return { m, n: ps.filter(p => p.amount > 0).length, col: ps.reduce((s, p) => s + p.amount - p.refunded, 0), com: ps.reduce((s, p) => s + Number(p.commission), 0), pay, po };
  });
  $("#vPay").innerHTML = `
    <h2>עמלות ושכר</h2>
    <p class="mute">20% מכל תשלום שאומת ב-Stripe על תיק שעודכן לפני התשלום או עד 48 שעות אחריו. חודש נסגר לפי תאריך התשלום, ומשולם ב-10 לחודש שאחריו. תשלום שהוחזר או הוכחש מקוזז.</p>
    <table><tr><th>חודש</th><th>תשלומים</th><th>נגבה נטו</th><th>עמלה</th><th>מועד תשלום</th><th>סטטוס</th><th></th></tr>
    ${rows.map(r => `<tr><td>${r.m}</td><td>${r.n}</td><td>${ils(r.col)}</td><td><b>${ils(r.com)}</b></td><td>${dmy(r.pay)}</td>
      <td>${r.po ? `<span class="chip ok">שולם ${dmy(new Date(r.po.paid_at))}${r.po.ref ? " · " + esc(r.po.ref) : ""}</span>` : r.m === cur ? `<span class="chip">חודש פתוח</span>` : `<span class="chip warn">ממתין לתשלום</span>`}</td>
      <td><button class="btn" data-csv="${r.m}">פירוט CSV</button>${boss() && !r.po && r.m !== cur ? ` <button class="btn g" data-pay="${r.m}">סמן כשולם</button>` : ""}</td></tr>`).join("")}
    </table>
    <h3>תשלומים אחרונים</h3>
    <table><tr><th>תאריך</th><th>לקוח</th><th>סכום</th><th>הוחזר</th><th>עמלה</th><th>חודש</th></tr>
    ${PAYS.filter(p => p.commissionable).slice(0, 50).map(p => { const c = CASES.find(x => x.phone === p.phone) || {}; return `<tr><td>${dmy(new Date(p.paid_at))}</td><td>${esc(c.name || p.phone)}</td>
      <td>${ils(p.amount)}</td><td>${p.refunded ? ils(p.refunded) : ""}</td><td>${p.commissionable ? ils(p.commission) : "ללא"}</td><td>${p.month}</td></tr>`; }).join("")}</table>`;
  document.querySelectorAll("[data-csv]").forEach(b => b.onclick = () => csv(b.dataset.csv));
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = async () => {
    const ref = prompt("אסמכתא / מספר העברה (לא חובה)") ?? "";
    const { error } = await SB.rpc("coll_mark_payout", { p_month: b.dataset.pay, p_ref: ref });
    if (error) return toast(error.message); toast("סומן כשולם"); await load();
  });
}
function csv(m){
  const ps = PAYS.filter(p => p.month === m && p.commissionable);
  const lines = [["תאריך","לקוח","טלפון","סכום","הוחזר","נטו","עמלה","מזהה Stripe"]].concat(ps.map(p => {
    const c = CASES.find(x => x.phone === p.phone) || {};
    return [dmy(new Date(p.paid_at)), c.name || "", local(p.phone), p.amount, p.refunded, p.amount - p.refunded, p.commission, p.id];
  }));
  lines.push(["סה\"כ","","","","", ps.reduce((s, p) => s + p.amount - p.refunded, 0), ps.reduce((s, p) => s + Number(p.commission), 0), ""]);
  const blob = new Blob(["﻿" + lines.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], {type: "text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `עמלות גבייה ${m}.csv`; a.click();
}
start();
</script>
