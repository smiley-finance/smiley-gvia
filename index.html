<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Smiley · מחלקת גבייה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<!-- CMS: email/SMS texts + send rules. Same files run on the server (Edge Function cms-send). Edit them in the CMS project, then build_real.py -->
<script>
// CMS · Collection Messaging Service · message templates
// ONE source for the email (HTML + plain text) and the SMS of every stage.
// Pure functions, no page / DOM: the same file moves into the Supabase Edge Function later.
//
// render(c, stage, ctx) -> { subject, pre, html, text, sms, attach }
//   c     = a case row as in coll_cases (first_name, name, phone, email, total, orders, orders_label,
//           address, payment_link, short_link, variant: sent|delivered|fraud, kind: "sub"|...)
//   stage = 1 first notice · 2 reminder · 3 warning letter (PDF attached) · 4 final reminder
//   ctx   = { due: "DD.MM.YYYY" deadline shown to the customer, hasEmail: bool }
(function (root) {
  const CONSENT_IMG = "https://cdn.shopify.com/s/files/1/0638/7816/8733/files/WhatsApp_Image_2026-10-27_at_01.43.26.jpg?v=1793091924";
  const SITE = "try-smiley.com";
  const BRAND = "#4f46e5";                                                            // one color for every email (all stages)
  const STATUS_AFTER = { 1: "נשלחה הודעה", 2: "נשלחה הודעה", 3: "נשלח מכתב התראה", 4: "סגור" };   // same as the WhatsApp steps
  const NAMES = { 1: "פנייה ראשונה", 2: "תזכורת", 3: "מכתב התראה", 4: "תזכורת אחרונה" };

  // ---------- text helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const plain = s => String(s).replace(/\*\*/g, "");                                   // **bold** -> bold
  const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");                     // escaped, then **bold** -> <b>
  const local = p => p && String(p).startsWith("972") ? "0" + String(p).slice(3) : String(p || "");
  const ordWord = c => (String(c.orders_label || "").includes(",") ? "הזמנות " : "הזמנה ") + c.orders_label;

  // "what happened" line, same wording as the WhatsApp template (msgs() in the dashboard)
  function mid(c) {
    const ord = ordWord(c);
    return c.variant === "fraud"
      ? `המוצרים בהזמנה (${ord}) נשלחו לכתובת שנמסרה בהזמנה. התשלום עליהם, בסך ${c.total}, בוטל דרך חברת האשראי של בעל הכרטיס, והסכום עדיין לא שולם.`
      : `המוצרים שהזמנת (${ord}) נשלחו${c.variant === "delivered" ? " ונמסרו" : ""} לכתובתך. התשלום עליהם, בסך ${c.total}, בוטל דרך חברת האשראי, והסכום עדיין לא שולם.`;
  }

  // ---------- content of each stage, as blocks (drawn as HTML and as plain text) ----------
  // block types: p, h, small, summary, pay, orders, faq, letter
  // days from today until a "DD.MM.YYYY" deadline (stage 4 says how many days are really left)
  function daysTo(due, now) {
    const m = /^(\d\d)\.(\d\d)\.(\d{4})$/.exec(due || ""); if (!m) return null;
    const d = Date.UTC(+m[3], +m[2] - 1, +m[1]), t = new Date(now || Date.now());
    return Math.max(0, Math.round((d - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5));
  }
  const daysWord = n => n === 1 ? "יום אחד" : `${n} ימים`;
  function blocks(c, stage, ctx) {
    const n = c.first_name || c.name || "", due = ctx.due, ord = ordWord(c), left = daysWord(daysTo(due, ctx.now) ?? 3);
    const hi = { t: "p", v: `שלום ${n},` };
    if (stage === 1) return {
      subject: `חוב פתוח בסך ${c.total} · ${ord}`,
      pre: `פרטי החוב, ההזמנה והמשלוח, וקישור לתשלום מאובטח עד ${due}`,
      b: [hi, { t: "p", v: "זו פנייה רשמית של מחלקת הכספים של Smiley בנוגע לחוב פתוח על שמך." },
        { t: "summary", title: "חוב פתוח" },
        { t: "h", v: "מה קרה?" }, { t: "p", v: mid(c) },
        { t: "pay", v: `לתשלום מאובטח · ${c.total}` }, { t: "small", v: "עם התשלום יישלח אישור למייל, והתיק ייסגר." },
        { t: "h", v: "פרטי ההזמנה והמשלוח" }, { t: "orders", full: true },
        { t: "h", v: "מה קורה אם החוב לא יוסדר?" },
        { t: "p", v: `יש להסדיר את מלוא הסכום עד **${due}**. אם החוב לא יוסדר עד המועד הזה, הטיפול בו יעבור לשלב הבא, ויישלח אליך מכתב התראה רשמי.` },
        { t: "h", v: "שאלות נפוצות" }, { t: "faq" },
        { t: "pay", v: `לתשלום · ${c.total}` }] };
    if (stage === 2) return {
      subject: `תזכורת: החוב בסך ${c.total} עדיין לא הוסדר`,
      pre: `המועד האחרון לתשלום: ${due}. לאחר מכן יישלח מכתב התראה רשמי.`,
      b: [hi, { t: "p", v: `תזכורת: החוב בסך ${c.total} בגין ${ord} עדיין לא הוסדר.` },
        { t: "summary", title: "תזכורת" },
        { t: "p", v: "לאחר המועד שנקבע יישלח אליך מכתב התראה רשמי. ניתן להסדיר את החוב בקישור האישי:" },
        { t: "pay", v: `לתשלום מאובטח · ${c.total}` },
        { t: "h", v: "תזכורת: מה קרה?" }, { t: "p", v: mid(c) }, { t: "orders", full: true },
        { t: "h", v: "שאלות נפוצות" }, { t: "faq" }] };
    if (stage === 3) return {
      subject: `מכתב התראה רשמי · חוב בסך ${c.total}`,
      pre: `מצורף מכתב התראה. ניתן להסדיר את החוב עד ${due}.`, attach: `מכתב התראה - ${c.name || n}.pdf`,
      b: [hi, { t: "p", v: `החוב בסך ${c.total} טרם הוסדר.` },
        { t: "letter" },
        { t: "summary", title: "מכתב התראה" },
        { t: "p", v: `ניתן להסדיר את מלוא החוב עד **${due}** בקישור האישי. לאחר מועד זה נפעל כמפורט במכתב.` },
        { t: "pay", v: `לתשלום מאובטח · ${c.total}` },
        { t: "h", v: "פרטי ההזמנה והמשלוח" }, { t: "p", v: mid(c) }, { t: "orders", full: true },
        { t: "h", v: "שאלות נפוצות" }, { t: "faq" }] };
    return {
      subject: `תזכורת אחרונה: נותרו ${left} · חוב בסך ${c.total}`,
      pre: `לאחר ${due} לא תישלח פנייה נוספת.`,
      b: [hi, { t: "p", v: `נותרו ${left} למועד האחרון שנקבע במכתב ההתראה.` },
        { t: "summary", title: "תזכורת אחרונה" },
        { t: "p", v: `החוב בסך ${c.total} עדיין פתוח. לאחר מועד זה לא תישלח פנייה נוספת.` },
        { t: "pay", v: `לתשלום מאובטח · ${c.total}` },
        { t: "h", v: "פרטי ההזמנה" }, { t: "orders", full: false },
        { t: "small", v: "מכתב ההתראה נשלח אליך במייל קודם. לכל שאלה אפשר להשיב למייל הזה." }] };
  }

  // FAQ = the WhatsApp ready replies, answered up front so the customer does not need to ask
  function faqItems(c) {
    const ord = ordWord(c), list = [
      ["מי אתם? זה לא עוקץ?", `זו מחלקת הכספים של Smiley, האתר ${SITE}. ה${ord} בוצעה עם מספר הטלפון ${local(c.phone)} ונשלחה לכתובת ${c.address || "שנמסרה בהזמנה"}. הקישור לתשלום מוביל לדף מאובטח של Stripe, בסכום החוב בלבד.`],
      ["לא קיבלתי את ההזמנה", "פרטי המשלוח ומספר המעקב מופיעים למעלה. ביטול החיוב דרך חברת האשראי אינו הדרך לבירור משלוח. אם יש בעיה במשלוח, אפשר להשיב למייל הזה."],
      ["כבר שילמתי", "לא התקבל תשלום בקישור האישי. אם שולם בדרך אחרת, יש להשיב למייל הזה עם צילום של אישור התשלום. עד אז התיק פתוח."],
      ["אפשר הנחה או תשלומים?", `לא ניתן להסדיר את החוב בהנחה או בתשלומים. הסכום לתשלום הוא ${c.total}.`],
      ["יש לי טענה לגבי החיוב", "אפשר להשיב למייל הזה ולפרט, ונחזור אליך."],
    ];
    if (c.kind === "sub") list.splice(2, 0, ["לא ידעתי שזה מנוי",
      "ההצטרפות למנוי הוצגה באתר בארבעה מקומות: בדף המוצר, בעגלה, בסיכום ההזמנה ומעל כפתור התשלום, עם נוסח הסכמה מפורש לחיוב אוטומטי. ניתן היה לבחור במקום זה רכישה חד־פעמית. המשלוחים יצאו אליך, והחוב הוא רק עליהם. ביטול מנוי מונע חיובים עתידיים בלבד, ואינו מבטל תשלום על משלוחים שכבר סופקו. המנוי כבר הופסק ולא יהיו חיובים נוספים.",
      CONSENT_IMG]);
    return list;
  }

  // ---------- HTML (table layout + inline styles: works in Gmail / Outlook / phones) ----------
  const F = "font-family:Arial,Helvetica,sans-serif;direction:rtl;";
  const box = (inner, bg) => `<table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" style="background:${bg};border-radius:12px;margin:0 0 10px"><tr><td style="padding:16px 18px;${F}">${inner}</td></tr></table>`;
  const row = (k, v) => `<tr><td style="${F}padding:5px 0;font-size:14px;color:#6b7085;width:105px;vertical-align:top">${k}</td><td style="${F}padding:5px 0;font-size:14px;color:#1b1d2a">${v}</td></tr>`;

  function htmlBlock(x, c, stage, ctx) {
    const color = BRAND, link = esc(c.payment_link);
    switch (x.t) {
      case "p": return `<p style="${F}font-size:15px;line-height:1.7;margin:0 0 10px;color:#1b1d2a">${rich(x.v)}</p>`;
      case "h": return `<h2 style="${F}font-size:17px;margin:24px 0 8px;color:#1b1d2a">${esc(x.v)}</h2>`;
      case "small": return `<p style="${F}font-size:13px;line-height:1.6;margin:6px 0 0;color:#6b7085;text-align:center">${esc(x.v)}</p>`;
      case "summary": {
        const cell = (k, v) => `<td style="${F}padding:8px 6px;text-align:center;width:33%"><div style="font-size:12px;color:#6b7085">${k}</div><div style="font-size:17px;font-weight:bold;color:#1b1d2a">${esc(v)}</div></td>`;
        return `<table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" style="border:2px solid ${color};border-radius:12px;margin:14px 0">
          <tr><td colspan="3" style="${F}background:${color};color:#fff;padding:8px 14px;font-weight:bold;font-size:14px">${esc(x.title)}</td></tr>
          <tr>${cell("סכום לתשלום", c.total)}${cell("מועד אחרון", ctx.due)}${cell(String(c.orders_label).includes(",") ? "הזמנות" : "הזמנה", c.orders_label)}</tr></table>`;
      }
      case "pay": return `<table role="presentation" dir="rtl" cellpadding="0" cellspacing="0" style="margin:18px auto 6px"><tr><td style="background:#16a34a;border-radius:10px">
          <a href="${link}" style="${F}display:inline-block;padding:14px 34px;color:#fff;font-size:17px;font-weight:bold;text-decoration:none">${esc(x.v)}</a></td></tr></table>
          <p style="${F}text-align:center;font-size:12px;color:#6b7085;margin:0">דף תשלום מאובטח של Stripe · כרטיס אשראי, ולרוב גם Apple Pay ו-Google Pay</p>`;
      case "letter": return box(`<div style="font-size:15px;font-weight:bold;color:#b91c1c">📎 מצורף מכתב התראה רשמי בנוגע לחוב</div><div style="font-size:14px;margin-top:4px;color:#33364a">יש לעיין בו. הקובץ מצורף למייל הזה.</div>`, "#fee2e2");
      case "orders": return (c.orders || []).map(o => box(`<table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0">
          ${row("מספר הזמנה", `<b>${esc(o.order)}</b>`)}${row("תאריך", esc(o.order_date))}${row("מוצרים", esc(o.products))}${row("סכום", esc(o.amount))}
          ${(o.shipments || []).map(s => row("משלוח", `${esc(s.carrier)} · <span dir="ltr">${esc(s.tracking)}</span><br><b>${esc(s.status)}</b>${s.date ? " · " + esc(s.date) : ""}${x.full && s.tracking_url ? ` · <a href="${esc(s.tracking_url)}" style="color:#4f46e5">מעקב אחרי המשלוח</a>` : ""}`)).join("")}
          ${x.full && c.address ? row("כתובת", esc(c.address)) : ""}</table>`, "#f7f8fc")).join("");
      case "faq": return `<table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0">` + faqItems(c).map(([q, a, img]) =>
          `<tr><td style="${F}padding:12px 0;border-bottom:1px solid #e4e6f0"><div style="font-weight:bold;font-size:15px;margin-bottom:4px;color:#1b1d2a">${esc(q)}</div><div style="font-size:14px;line-height:1.7;color:#33364a">${esc(a)}</div>${img ? `<img src="${img}" alt="כך הוצגה ההסכמה למנוי באתר" width="260" style="display:block;margin-top:10px;border:1px solid #e4e6f0;border-radius:8px;max-width:100%">` : ""}</td></tr>`).join("") + `</table>`;
    }
    return "";
  }
  function shell(stage, subject, pre, inner) {
    return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(subject)}</title></head>
<body dir="rtl" style="margin:0;padding:24px 12px;background:#f4f5f8;direction:rtl">
<div dir="rtl" style="direction:rtl;text-align:right">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">${esc(pre)}</div>
<table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<table role="presentation" dir="rtl" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e4e6f0">
  <tr><td style="background:${BRAND};padding:18px 24px;${F}color:#fff;text-align:right">
    <div style="font-size:20px;font-weight:bold">Smiley</div><div style="font-size:13px;opacity:.9">מחלקת הכספים · ${esc(NAMES[stage])}</div></td></tr>
  <tr><td style="padding:24px;${F}text-align:right">${inner}</td></tr>
  <tr><td style="background:#f7f8fc;padding:16px 24px;${F}font-size:12px;color:#6b7085;line-height:1.6;text-align:right">
    לכל שאלה אפשר להשיב למייל הזה.<br>Smiley · מחלקת הכספים · ${SITE}<br>הודעה זו נשלחה אליך בנוגע לחוב פתוח על שמך.</td></tr>
</table></td></tr></table></div></body></html>`;
  }

  // ---------- plain text (sent next to the HTML: better delivery, and readable anywhere) ----------
  function textBlock(x, c, stage, ctx) {
    switch (x.t) {
      case "p": return plain(x.v);
      case "h": return "\n" + x.v + "\n" + "-".repeat(Math.min(30, x.v.length + 2));
      case "small": return x.v;
      case "summary": return `${x.title}: ${c.total} · מועד אחרון ${ctx.due} · ${ordWord(c)}`;
      case "pay": return `${x.v}:\n${c.payment_link}`;
      case "letter": return "מצורף מכתב התראה רשמי בנוגע לחוב. יש לעיין בו.";
      case "orders": return (c.orders || []).map(o => [`הזמנה ${o.order} · ${o.order_date} · ${o.amount}`, o.products,
        ...(o.shipments || []).map(s => `משלוח: ${s.carrier} ${s.tracking} · ${s.status}${s.date ? " · " + s.date : ""}${x.full && s.tracking_url ? "\n" + s.tracking_url : ""}`),
        x.full && c.address ? `כתובת: ${c.address}` : ""].filter(Boolean).join("\n")).join("\n\n");
      case "faq": return faqItems(c).map(([q, a]) => `* ${q}\n${a}`).join("\n\n");
    }
    return "";
  }

  // ---------- SMS: a short one-way notification; the email has the details ----------
  // Hebrew SMS = UCS-2: 70 characters for one message, 67 per part when longer. Aim: 2 parts at most.
  function sms(c, stage, ctx) {
    const n = c.first_name || "", L = c.short_link || c.payment_link, d = shortDate(ctx.due), left = daysWord(daysTo(ctx.due, ctx.now) ?? 3);
    const mail = ctx.hasEmail !== false;
    const RLM = String.fromCharCode(0x200F);                  // invisible right-to-left mark (U+200F)
    return RLM + {
      1: mail ? `Smiley: שלום ${n}, חוב פתוח על שמך בסך ${c.total}. כל הפרטים נשלחו אליך למייל. לתשלום עד ${d}:\n${L}`
              : `Smiley: שלום ${n}, חוב פתוח על שמך בסך ${c.total} (הזמנה ${c.orders_label}). לתשלום מאובטח עד ${d}:\n${L}`,
      2: mail ? `Smiley: תזכורת, החוב בסך ${c.total} לא הוסדר. הפרטים במייל. לתשלום עד ${d}:\n${L}`
              : `Smiley: תזכורת, החוב בסך ${c.total} לא הוסדר. לתשלום עד ${d}:\n${L}`,
      3: mail ? `Smiley: נשלח אליך למייל מכתב התראה רשמי, חוב ${c.total}. להסדרה עד ${d}:\n${L}`
              : `Smiley: נשלח אליך מכתב התראה רשמי בנוגע לחוב בסך ${c.total}. להסדרה עד ${d}:\n${L}`,
      4: `Smiley: נותרו ${left} להסדרת החוב בסך ${c.total}. אחרי ${d} לא תישלח פנייה נוספת:\n${L}`,
    }[stage];
  }
  const shortDate = due => String(due || "").replace(/^(\d\d)[./](\d\d)[./]\d{4}$/, "$1.$2");
  function segs(t) {
    const gsm = /^[\x20-\x7E\n\r£¥èéùìòÇØøÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ¤¡ÄÖÑÜ§¿äöñüà€]*$/.test(t);
    const len = [...t].length, one = gsm ? 160 : 70, part = gsm ? 153 : 67;
    return { len, parts: len <= one ? 1 : Math.ceil(len / part), enc: gsm ? "GSM" : "UCS-2", one };
  }

  function render(c, stage, ctx) {
    ctx = Object.assign({ hasEmail: !!c.email }, ctx);
    const s = blocks(c, stage, ctx);
    const html = shell(stage, s.subject, s.pre, s.b.map(x => htmlBlock(x, c, stage, ctx)).join(""));
    const text = s.b.map(x => textBlock(x, c, stage, ctx)).filter(Boolean).join("\n\n")
      + `\n\n--\nלכל שאלה אפשר להשיב למייל הזה.\nSmiley · מחלקת הכספים · ${SITE}`;
    const sm = sms(c, stage, ctx);
    return { stage, name: NAMES[stage], subject: s.subject, pre: s.pre, html, text, attach: s.attach || null,
             sms: sm, smsInfo: segs(sm), statusAfter: STATUS_AFTER[stage] };
  }

  root.CMS_T = { render, segs, NAMES, STATUS_AFTER, local };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
// CMS · the send rules. This is the logic the Supabase Edge Function will run (here it runs in the mock).
// plan(c, stage, ctx) decides IF a stage may go out, to which channels, with which deadline and texts.
// Nothing is sent from here: the caller (fake server now, Edge Function later) does the sending.
//
// Flow: the agent sends stage 1 by hand. Stages 2-4 then go out AUTOMATICALLY on the day timer
// (a scheduler runs every 15 minutes on the server: autoPick() says what is due now).
// Sending window for every stage: Sunday-Thursday, 08:00-20:00 Israel time. Never Friday or Saturday.
//
// ctx = { log: [messages of this case], now: Date, ignoreQuiet: bool (test only) }
// log rows look like the planned table cms_messages:
//   { id, phone, stage, channel: "email"|"sms", to, subject, body, due, status: "queued"|"sent"|"delivered"|"failed", error, at }
(function (root) {
  const T = root.CMS_T;
  const DONE = "בוצע – ממתין לאימות", HOLD = "בבדיקה/המתנה";
  const DAY = 864e5;

  // Israel time parts (the server runs in UTC, the rules are Israeli)
  function il(now) {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Jerusalem", weekday: "short", hour: "numeric", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit" })
      .formatToParts(now).map(x => [x.type, x.value]));
    return { wd: p.weekday, h: Number(p.hour), day: `${p.year}-${p.month}-${p.day}` };
  }
  const ilDay = d => il(new Date(d)).day;
  const fmt = d => new Intl.DateTimeFormat("he-IL", { timeZone: "Asia/Jerusalem", day: "2-digit", month: "2-digit", year: "numeric" }).format(d).replace(/\//g, ".");

  // Israeli holidays (no sending all day), from the Hebrew calendar built into every browser and Deno: no list to update.
  // Yom tov days + Yom HaZikaron/Yom HaAtzmaut. The eve of Rosh Hashana, Yom Kippur, Sukkot, Pesach and Shavuot: nothing from 13:00.
  const HEB = new Intl.DateTimeFormat("en-u-ca-hebrew", { timeZone: "Asia/Jerusalem", month: "long", day: "numeric" });
  const hebDay = d => { const p = Object.fromEntries(HEB.formatToParts(d).map(x => [x.type, x.value])); return p.month + " " + p.day; };
  const HOLIDAYS = { "Tishri 1": "ראש השנה", "Tishri 2": "ראש השנה", "Tishri 10": "יום כיפור", "Tishri 15": "סוכות",
    "Tishri 22": "שמחת תורה", "Nisan 15": "פסח", "Nisan 21": "שביעי של פסח", "Sivan 6": "שבועות" };
  const EVES = { "Elul 29": "ערב ראש השנה", "Tishri 9": "ערב יום כיפור", "Tishri 14": "ערב סוכות", "Tishri 21": "ערב שמחת תורה",
    "Nisan 14": "ערב פסח", "Nisan 20": "ערב שביעי של פסח", "Sivan 5": "ערב שבועות" };
  // Yom HaAtzmaut is 5 Iyar, moved so it never touches Shabbat (Fri/Sat -> Thursday before, Monday -> Tuesday); Yom HaZikaron is the day before.
  function atzmaut(now) {
    const { wd } = il(now), hd = hebDay(now), back = n => hebDay(new Date(+now - n * DAY)), fwd = n => hebDay(new Date(+now + n * DAY));
    const isAtz = (wd === "Thu" && (hd === "Iyar 4" || hd === "Iyar 3")) ? (fwd(1) === "Iyar 5" || fwd(2) === "Iyar 5")
      : wd === "Tue" && hd === "Iyar 6" ? back(1) === "Iyar 5"
      : hd === "Iyar 5" && !["Fri", "Sat", "Mon"].includes(wd);
    if (isAtz) return "יום העצמאות";
    if (atzmautTomorrow(now)) return "יום הזיכרון";
    return null;
  }
  const atzmautTomorrow = now => { const t = new Date(+now + DAY), { wd } = il(t), hd = hebDay(t);
    return (wd === "Thu" && (hd === "Iyar 4" || hd === "Iyar 3") && (hebDay(new Date(+t + DAY)) === "Iyar 5" || hebDay(new Date(+t + 2 * DAY)) === "Iyar 5"))
      || (wd === "Tue" && hd === "Iyar 6" && hebDay(new Date(+t - DAY)) === "Iyar 5") || (hd === "Iyar 5" && !["Fri", "Sat", "Mon"].includes(wd)); };
  function holiday(now) {
    const hd = hebDay(now), { h } = il(now);
    if (HOLIDAYS[hd]) return `חג (${HOLIDAYS[hd]}): לא שולחים היום`;
    const n = atzmaut(now); if (n) return `${n}: לא שולחים היום`;
    if (EVES[hd] && h >= 13) return `${EVES[hd]}: לא שולחים אחרי 13:00`;
    return null;
  }

  // sending window: Sunday-Thursday 08:00-20:00. Friday + Saturday + Israeli holidays: nothing goes out.
  function quiet(now) {
    const { wd, h } = il(now);
    if (wd === "Fri" || wd === "Sat") return "סוף שבוע: שולחים רק בימים א׳–ה׳";
    const hol = holiday(now); if (hol) return hol;
    if (h < 8 || h >= 20) return "מחוץ לשעות: שולחים רק בין 08:00 ל-20:00";
    return null;
  }
  // the first moment from d (or now) that is inside the window, on a 15-minute step (the scheduler's rhythm)
  function nextWindow(d) {
    let t = new Date(Math.ceil(+new Date(d) / 9e5) * 9e5);
    for (let i = 0; i < 4 * 24 * 8 && quiet(t); i++) t = new Date(+t + 9e5);
    return t;
  }
  const WD = { Sun: "א׳", Mon: "ב׳", Tue: "ג׳", Wed: "ד׳", Thu: "ה׳", Fri: "ו׳", Sat: "ש׳" };
  const when = d => `יום ${WD[il(d).wd]} ${fmt(d).slice(0, 5)} ${new Intl.DateTimeFormat("he-IL", { timeZone: "Asia/Jerusalem", hour: "2-digit", minute: "2-digit" }).format(d)}`;
  const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || ""));
  const validPhone = p => /^9725\d{8}$/.test(String(p || ""));                                // Israeli mobile, international format
  const isPaid = c => Number(c.paid_amount || 0) * 100 >= c.amount - 1;

  // the deadline the customer sees. Stage 2 repeats stage 1's date, stage 4 repeats stage 3's (kept in the log).
  function dueFor(c, stage, log, now) {
    const first = s => log.find(m => m.stage === s && m.due);
    if (stage === 2 && first(1)) return first(1).due;
    if (stage === 4 && first(3)) return first(3).due;
    // stage 1 / 3 set a new deadline; a reminder with no earlier send (agent moved the status by hand) gets a fresh one too
    return fmt(new Date(+now + (stage <= 2 ? 7 : 14) * DAY));
  }

  function plan(c, stage, ctx) {
    ctx = ctx || {};
    const now = ctx.now || new Date(), log = (ctx.log || []).filter(m => m.phone === c.phone);
    const errors = [], warnings = [];
    const sent = s => log.some(m => m.stage === s && m.status !== "failed");

    // 1. the case. The email/SMS flow has its OWN status (email_status), separate from the WhatsApp status.
    //    Shared between the flows: the customer details, and a payment verified in Stripe (it ends both).
    const st = c.email_status || "חדש";
    if (st === "סגור") errors.push("התיק סגור בזרימת המייל/SMS");
    if (isPaid(c) || String(c.status).startsWith("שולם")) errors.push("התיק שולם (אומת ב-Stripe)");
    if (st === DONE) errors.push("הלקוח אמר ששילם: ממתינים לאימות התשלום");
    if (st === HOLD) errors.push("התיק בבדיקה/המתנה");
    if (c.status && c.status !== "חדש") warnings.push(`לידיעה: בוואטסאפ הלקוח בסטטוס "${c.status}" (זרימה נפרדת)`);
    // 2. the stage
    if (sent(stage)) errors.push(`שלב ${stage} כבר נשלח ללקוח הזה`);
    if (log.some(m => m.status !== "failed" && ilDay(m.at) === il(now).day)) errors.push("כבר נשלחה ללקוח הודעה היום. שלב אחד ביום לכל היותר");
    if (stage === 2 && st === "חדש" && !sent(1)) errors.push("קודם לשלוח את הפנייה הראשונה (שלב 1)");
    if (stage === 3 && !c.letter_path) errors.push("מכתב ההתראה עוד לא מוכן (אין PDF)");
    if (stage === 4 && st !== "נשלח מכתב התראה" && !sent(3)) errors.push("קודם לשלוח את מכתב ההתראה (שלב 3)");
    // 3. when
    const q = quiet(now);
    if (q) (ctx.ignoreQuiet ? warnings : errors).push(q + (ctx.ignoreQuiet ? " (מצב בדיקה: מתעלמים)" : ""));
    // 4. the channels
    const email = validEmail(c.email), sms = validPhone(c.phone);
    if (!email) warnings.push(c.email ? `כתובת המייל לא תקינה (${c.email}): יישלח SMS בלבד` : "אין מייל ללקוח: יישלח SMS בלבד. כדאי להמשיך בוואטסאפ");
    if (!sms) warnings.push("מספר הטלפון אינו נייד ישראלי: יישלח מייל בלבד");
    if (!email && !sms) errors.push("אין מייל ואין נייד תקין: אי אפשר לשלוח");
    if (log.some(m => m.channel === "email" && m.status === "failed")) warnings.push("מייל קודם ללקוח הזה חזר (נכשל). לבדוק את הכתובת");

    const due = dueFor(c, stage, log, now);
    const msg = T.render(c, stage, { due, hasEmail: email, now });
    if (msg.smsInfo.parts > 2) warnings.push(`ה-SMS ארוך: ${msg.smsInfo.parts} חלקים`);
    return { ok: errors.length === 0, errors, warnings, stage, due, channels: { email, sms },
             to: { email: email ? c.email : null, sms: sms ? c.phone : null }, msg, statusAfter: T.STATUS_AFTER[stage] };
  }

  // where a customer stands in the 4 stages, and when the next one is due (same days as the WhatsApp flow):
  // Email/SMS timer (the user's decision 12.11.2026): stage 1 (agent) day 0 -> stage 2 day 3 -> stage 3 letter day 8 -> stage 4 day 11.
  // All counted from the day stage 1 was sent. (The WhatsApp flow keeps its own timing.)
  // Uses ONLY the email/SMS flow: its log and its own status (email_status). The WhatsApp status is not used here.
  function track(c, allLog, now) {
    now = now || new Date();
    const log = allLog.filter(m => m.phone === c.phone).sort((a, b) => a.at.localeCompare(b.at));
    const ok = log.filter(m => m.status !== "failed");
    const at = s => { const m = ok.find(x => x.stage === s); return m ? new Date(m.at) : null; };
    const st = c.email_status || "חדש";
    let stage = Math.max(0, ...ok.map(m => m.stage));
    if (!stage && st === "נשלח מכתב התראה") stage = 3;              // the agent moved the email status by hand
    else if (!stage && st === "נשלחה הודעה") stage = 1;
    const s1 = at(1) || (c.email_touched_at && new Date(c.email_touched_at)), s3 = at(3) || (st === "נשלח מכתב התראה" && c.email_last_at && new Date(c.email_last_at));
    const closed = st === "סגור" || isPaid(c) || String(c.status).startsWith("שולם");
    const waiting = st === DONE || st === HOLD;
    const talking = st === "בתהליך";                            // in a conversation with the customer: no automatic next stage
    const plus = (d, n) => d ? new Date(+d + n * DAY) : now;
    let next = null, due = null;
    if (!closed && !waiting && !talking && stage < 4) {
      next = stage + 1;
      due = next === 1 ? now : next === 2 ? plus(s1, 3) : next === 3 ? plus(s1, 8) : plus(s1, 11);
    }
    const last = log[log.length - 1] || null, lastStage = last ? log.filter(m => m.stage === last.stage) : [];
    const auto = !!next && next >= 2;                               // stages 2-4 go out by themselves
    const sendAt = auto ? nextWindow(due > now ? due : now) : null;   // when the scheduler will actually send it
    return {
      stage, next, due, dueNow: !!due && due <= now, auto, sendAt, sendAtText: sendAt ? when(sendAt) : null,
      manualDue: next === 1,                                         // only stage 1 waits for an agent's click
      blocked: next === 3 && !c.letter_path ? "מכתב בהכנה" : null,
      lastAt: last ? new Date(last.at) : null,
      email: (lastStage.find(m => m.channel === "email") || {}).status || null,     // delivery of the last stage, per channel
      sms: (lastStage.find(m => m.channel === "sms") || {}).status || null,
      failed: log.some(m => m.status === "failed"),
      closed, waiting, talking, status: st, count: log.length,
    };
  }

  // the scheduler: which automatic stages (2-4) go out right now. Same rules as a manual send (plan), plus the window.
  function autoPick(cases, allLog, now, opt) {
    now = now || new Date(); opt = opt || {};
    if (quiet(now) && !opt.ignoreQuiet) return [];
    return cases.map(c => ({ c, t: track(c, allLog, now) }))
      .filter(({ t }) => t.auto && t.dueNow && !t.blocked)
      .map(({ c, t }) => ({ c, stage: t.next, plan: plan(c, t.next, { log: allLog, now, ignoreQuiet: opt.ignoreQuiet }) }))
      .filter(x => x.plan.ok);
  }

  root.CMS_SEND = { plan, track, autoPick, quiet, holiday, nextWindow, when, validEmail, validPhone, fmt };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script>
const SB = supabase.createClient("https://pqlfvflccwccgsakovcj.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxbGZ2ZmxjY3djY2dzYWtvdmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MDM1MjcsImV4cCI6MjExMDA3OTUyN30.LAR91YTi7rz_QT3SO1fQGW6DD_pZEnrwlmqAyBkrpis");

let ME = null, ADMIN = false, EARNS = false, AGENT_VIEW = false, CASES = [], PAYS = [], PAYOUTS = [], VIEW = "sum", SEL = null, WAEV = [];
let MSGS = [], ALLCASES = [], TF = { p: "7", ch: "", st: "", q: "", col: "" };   // CMS: messages log, all cases, tracking filters

const ils = n => "₪" + Number(n || 0).toLocaleString("he-IL", {minimumFractionDigits: 0, maximumFractionDigits: 2});
const today = () => new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Jerusalem"}));
const dmy = d => d.toLocaleDateString("he-IL", {day: "2-digit", month: "2-digit", year: "numeric"});

    SB.from("coll_payments").select("*").order("paid_at", {ascending: false}),

  }));
}

  ].sort((x, y) => y.at.localeCompare(x.at));
  const lbl = { "1": "היום", "7": "7 הימים האחרונים", "30": "30 הימים האחרונים" }[SP];
  $("#vSum").innerHTML = `
    <div class="sumh"><h2>סיכום · ${lbl}</h2><span class="mute">${a.toLocaleDateString("he-IL")}${SP === "1" ? "" : " – " + new Date().toLocaleDateString("he-IL")}</span><span class="sp"></span>
      <div class="seg" id="sp">${[["1", "היום"], ["7", "שבוע"], ["30", "חודש"]].map(([k, t]) => `<button data-sp="${k}" class="${k === SP ? "on" : ""}">${t}</button>`).join("")}</div></div>
    <div class="kpis sk">
      <div class="kpi main"><b>${ils(S.collected)}</b><span>נגבה (${S.pays.length} תשלומים)</span>${delta(S.collected, P.collected, true)}</div>
      <div class="kpi"><b>${ils(S.commission)}</b><span>עמלה (20%)</span>${delta(S.commission, P.commission, true)}</div>
      <div class="kpi"><b>${S.touched.size}</b><span>לקוחות שטופלו</span>${delta(S.touched.size, P.touched.size)}</div>
      <div class="kpi"><b>${S.incoming}</b><span>תיקים חדשים שנכנסו</span>${delta(S.incoming, P.incoming)}</div>
      <div class="kpi"><b>${S.wa.length}</b><span>💬 פעולות וואטסאפ</span>${delta(S.wa.length, P.wa.length)}</div>
      <div class="kpi"><b>${S.ss.length}</b><span>📧 שליחות מייל + SMS</span><small class="mute">${S.ms.length ? Math.round(S.delivered * 100 / S.ms.length) + "% נמסרו" : "&nbsp;"}${S.failed ? ` · <span class="er">${S.failed} נכשלו</span>` : ""}</small></div>
    </div>
    <div class="sg2">
      <div class="card sc"><div class="sch"><h3>פעילות ${SP === "1" ? "לפי שעה" : "לפי יום"}</h3>
        <span class="lg"><i style="background:${WA_C}"></i>💬 וואטסאפ</span><span class="lg"><i style="background:${EM_C}"></i>📧 מייל + SMS</span></div>
        ${barChart("cha", B, [{ k: "wa", n: "💬 וואטסאפ", c: WA_C }, { k: "em", n: "📧 מייל + SMS", c: EM_C }], v => String(Math.round(v)))}</div>
      <div class="card sc"><div class="sch"><h3>נגבה ${SP === "1" ? "לפי שעה" : "לפי יום"}</h3></div>
        ${barChart("chp", B, [{ k: "pay", n: "נגבה", c: EM_C }], v => ils(v))}</div>
    </div>
    <div class="sg2">
      <div class="card sc"><div class="sch"><h3>💬 מה נעשה בוואטסאפ</h3><span class="mute">${S.wa.length} פעולות</span></div>${hbars(waMoves.filter(x => x[1]), WA_C)}</div>
      <div class="card sc"><div class="sch"><h3>📧 מה נשלח במייל + SMS</h3><span class="mute">${S.ss.length} שליחות</span></div>${hbars(emStages.map(([n, v]) => [`שלב ${n} · ${CMS_T.NAMES[n]}`, v]).filter(x => x[1]), EM_C)}</div>
    </div>
    <div class="sg2">
      <div class="card sc"><div class="sch"><h3>💬 איפה כל התיקים עומדים עכשיו · וואטסאפ</h3><span class="mute">${CASES.length} בשולחן</span></div>${hbars(waNow, WA_C)}</div>
      <div class="card sc"><div class="sch"><h3>📧 איפה כל התיקים עומדים עכשיו · מייל/SMS</h3></div>${hbars(emNow, EM_C)}</div>
    </div>
    <div class="sg2">
      <div class="card sc"><div class="sch"><h3>עדיין פתוח לטיפול היום</h3></div>
        <div class="due2">
          <div><b class="big">${waDue.length}</b> 💬 בוואטסאפ ${waDue.slice(0, 6).map(c => `<button class="dl" data-wa="${c.phone}"><b>${esc(c.name)}</b><span>${esc(next(c))}</span></button>`).join("")}
            <button class="btn sm" id="goall">לוואטסאפ ←</button></div>
          <div><b class="big">${emDue.length}</b> 📧 במייל/SMS ${emDue.slice(0, 6).map(({ c, t }) => `<button class="dl" data-em="${c.phone}"><b>${esc(c.name)}</b><span>לשלוח שלב ${t.next} · ${CMS_T.NAMES[t.next]}</span></button>`).join("")}
            <button class="btn sm" id="gotrack">למייל / SMS ←</button></div>
        </div></div>
      <div class="card sc"><div class="sch"><h3>יומן פעילות</h3><span class="mute">${feed.length} פעולות</span></div>
        <div class="feed">${feed.slice(0, 60).map(x => `<div class="fi" data-${x.f === "em" ? "em" : "wa"}="${x.who}"><span class="fic">${x.ic}</span><div><b>${esc(name(x.who))}</b> · ${esc(x.what)}</div>
          <span class="mute">${new Date(x.at).toLocaleString("he-IL", SP === "1" ? { hour: "2-digit", minute: "2-digit" } : { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></div>`).join("") || `<p class="mute">אין פעילות בתקופה הזו.</p>`}</div></div>
    </div>`;
  document.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { SP = b.dataset.sp; ls("sumP", SP); summary(); });
  const toAll = phone => { document.querySelector('.tab[data-v="all"]').click(); if (phone) { if (CASES.find(c => c.phone === phone)) openCase(phone); else toast("התיק שולם ואומת, ולכן כבר לא בשולחן"); } };
  $("#goall").onclick = () => toAll(); $("#gotrack").onclick = () => document.querySelector('.tab[data-v="track"]').click();
  document.querySelectorAll("#vSum [data-wa]").forEach(b => b.onclick = () => toAll(b.dataset.wa));
  document.querySelectorAll("#vSum [data-em]").forEach(b => b.onclick = () => openEmail(b.dataset.em));
  // hover tooltip on the charts
  const tip = $("#ctip");
  document.querySelectorAll("#vSum .cc").forEach(col => {
    col.onmouseenter = () => { const [h, ...rows] = col.dataset.tip.split("|"); tip.innerHTML = `<b>${h}</b>` + rows.map(r => `<div>${r}</div>`).join(""); tip.style.display = "block"; };
    col.onmousemove = e => { tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px"; };
    col.onmouseleave = () => tip.style.display = "none";
  });
}

// visual only: color the current status button by its status
new MutationObserver(() => document.querySelectorAll(".steps .btn.p").forEach(b => { const k = b.dataset.st || b.dataset.est; if (k && COLC[k]) b.style.setProperty("--sc", COLC[k]); }))
  .observe(document.body, { childList: true, subtree: true });

// ---------- 👥 customers: customer details only, grouped by the day they came in ----------
// "Came in" = created_at when the server has it, otherwise the dispute date (latest). No flow statuses here.
let CF = { q: "", r: ["7", "30", "90", ""].includes(ls("custR")) ? ls("custR") : "30", open: null, hf: "" };
// customers page only: ONE timeline with both flows together (WhatsApp + email + SMS + payments).
// Everywhere else the two flows stay apart.
function timeline(c){
  const items = [
    ...WAEV.filter(e => e.phone === c.phone && !String(e.status).startsWith("שולם")).map(e => ({ at: e.at, f: "wa", tag: "💬 וואטסאפ", what: e.status, note: e.note })),
    ...Object.values(MSGS.filter(m => m.phone === c.phone).reduce((g, m) => { const k = m.stage + "|" + m.at.slice(0, 16); (g[k] = g[k] || []).push(m); return g; }, {}))
      .map(g => ({ at: g[0].at, f: "em", tag: "📧 מייל + SMS", what: `שלב ${g[0].stage} · ${CMS_T.NAMES[g[0].stage]}`,
        note: g.map(m => `${m.channel === "email" ? "מייל" : "SMS"}: ${MST[m.status][0]}${m.error ? " (" + m.error + ")" : ""}`).join(" · "), bad: g.some(m => m.status === "failed") })),
    ...CEV.filter(e => e.phone === c.phone && !String(e.note || "").startsWith("📧💬")).map(e => ({ at: e.at, f: "em", tag: "📧 מייל + SMS", what: "סטטוס: " + e.status, note: e.note, bad: String(e.note || "").includes("⚠") })),
    ...PAYS.filter(p => p.phone === c.phone && p.amount > 0).map(p => ({ at: p.paid_at, f: "pay", tag: "💰 תשלום", what: `שולם ${ils(p.amount)}`, note: "אומת ב-Stripe" })),
  ].filter(x => !CF.hf || x.f === CF.hf || x.f === "pay").sort((a, b) => b.at.localeCompare(a.at));
  return `<div class="tlh"><b>היסטוריית הודעות</b>
      <span class="tlst">💬 וואטסאפ: <b>${esc(c.status)}</b></span><span class="tlst em">📧 מייל/SMS: <b>${esc(c.email_status || "חדש")}</b></span><span class="sp"></span>
      <span class="tlf">${[["", "הכל"], ["wa", "💬 וואטסאפ"], ["em", "📧 מייל + SMS"]].map(([k, t]) => `<button data-hf="${k}" class="${k === CF.hf ? "on" : ""}">${t}</button>`).join("")}</span></div>
    <div class="tli">${items.map(x => `<div class="ti ${x.f} ${x.bad ? "bad" : ""}"><span class="tg">${x.tag}</span><div><b>${esc(x.what)}</b>${x.note ? `<div class="mute">${esc(x.note)}</div>` : ""}</div>
      <span class="mute">${new Date(x.at).toLocaleString("he-IL", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></div>`).join("") || `<p class="mute">עוד לא נשלחו הודעות ללקוח הזה.</p>`}</div>`;
}
const VARL = { sent: "נשלח", delivered: "נשלח ונמסר", fraud: "בעל כרטיס אחר" };
const cameIn = c => c.created_at || c.latest;
function dayTitle(k){
  const t = jday(Date.now()), y = jday(Date.now() - 864e5);
  const d = new Date(k + "T12:00:00");
  const full = d.toLocaleDateString("he-IL", { weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" });
  return k === t ? `היום <span class="mute">· ${full}</span>` : k === y ? `אתמול <span class="mute">· ${full}</span>` : full;
}
function customers(){
  const from = CF.r ? Date.now() - Number(CF.r) * 864e5 : 0;
  const list = ALLCASES.filter(c => cameIn(c) && new Date(cameIn(c)) >= from).filter(c => !CF.q || hit(c, CF.q.toLowerCase()))
    .sort((a, b) => cameIn(b).localeCompare(cameIn(a)));
  const days = {}; list.forEach(c => (days[jday(cameIn(c))] = days[jday(cameIn(c))] || []).push(c));
  const keys = Object.keys(days).sort().reverse();
  const today = (days[jday(Date.now())] || []).length;
  const tm = iso => new Date(iso).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
  const row = c => `<div class="cu ${CF.open === c.phone ? "op" : ""}" data-cu="${c.phone}">
      <div class="cu1">
        <span class="ct">${tm(cameIn(c))}</span>
        <div class="cn"><b>${esc(c.name)}</b><span class="mute">${esc(c.case_type || "")}${c.kind === "sub" ? " · מנוי" : ""}</span></div>
        <span class="cph" dir="ltr">${esc(local(c.phone))}</span>
        <span class="cem">${c.email ? esc(c.email) : `<span class="wn">אין מייל</span>`}</span>
        <span class="cor">${esc(c.orders_label || "")}</span>
        <b class="cam">${esc(c.total)}${isPaid(c) ? ` <span class="chip ok">שולם</span>` : ""}</b>
      </div>
      ${CF.open === c.phone ? `<div class="cu2">
        <div><span class="k">כתובת</span>${esc(c.address || "")}</div>
        <div><span class="k">סוג תיק</span>${esc(VARL[c.variant] || c.variant || "")}</div>
        <div><span class="k">נכנס</span>${new Date(cameIn(c)).toLocaleString("he-IL")}</div>
        <div class="qc"><button class="btn sm" data-copy="${esc(local(c.phone))}">📋 העתק טלפון</button>${c.email ? `<button class="btn sm" data-copy="${esc(c.email)}">📋 העתק מייל</button>` : ""}${c.payment_link ? `<button class="btn sm" data-copy="${esc(c.payment_link)}">🔗 העתק קישור תשלום</button>` : ""}</div>
        ${(c.orders || []).map(o => `<div class="order"><b>${esc(o.order)}</b> · ${esc(o.order_date)} · ${esc(o.amount)}<br><span class="mute">${esc(o.products)}</span>
          ${o.shipments.map(s => `<br>${esc(s.carrier)} <span dir="ltr">${esc(s.tracking)}</span> · <b>${esc(s.status)}</b>${s.date ? " · " + esc(s.date) : ""}`).join("")}</div>`).join("")}
        <div class="tl2">${timeline(c)}</div>
      </div>` : ""}
    </div>`;
  $("#vCust").innerHTML = `
    <div class="sumh"><h2>👥 לקוחות</h2><span class="mute">${list.length} לקוחות · ${keys.length} ימים${today ? ` · <b class="okk">🆕 ${today} נכנסו היום</b>` : ""}</span><span class="sp"></span>
      <input id="cq" class="cq" placeholder="🔍 שם / טלפון / 4 ספרות / הזמנה / מייל" value="${esc(CF.q)}">
      <div class="seg" id="cr">${[["7", "שבוע"], ["30", "חודש"], ["90", "3 חודשים"], ["", "הכל"]].map(([k, t]) => `<button data-cr="${k}" class="${k === CF.r ? "on" : ""}">${t}</button>`).join("")}</div></div>
    <div class="card cl">
      <div class="cu cuh"><div class="cu1"><span class="ct">שעה</span><span class="cn">לקוח</span><span class="cph">טלפון</span><span class="cem">מייל</span><span class="cor">הזמנה</span><span class="cam">סכום</span></div></div>
      ${keys.map(k => `<div class="dg"><div class="dh"><b>${dayTitle(k)}</b><span class="sp"></span><span class="dc">${days[k].length} לקוחות</span><span class="ds">${ils(days[k].reduce((t, c) => t + c.amount / 100, 0))}</span></div>
        ${days[k].map(row).join("")}</div>`).join("") || `<div class="empty">אין לקוחות בטווח הזה.</div>`}
    </div>`;
  $("#cq").oninput = e => { CF.q = e.target.value; customers(); const i = $("#cq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  document.querySelectorAll("[data-cr]").forEach(b => b.onclick = () => { CF.r = b.dataset.cr; ls("custR", CF.r); customers(); });
  document.querySelectorAll("#vCust [data-copy]").forEach(b => b.onclick = e => { e.stopPropagation(); navigator.clipboard.writeText(b.dataset.copy); toast("הועתק"); });
  document.querySelectorAll("#vCust [data-hf]").forEach(b => b.onclick = e => { e.stopPropagation(); CF.hf = b.dataset.hf; customers(); });
  document.querySelectorAll("#vCust .cu[data-cu]").forEach(r => r.querySelector(".cu1").onclick = () => { CF.open = CF.open === r.dataset.cu ? null : r.dataset.cu; customers(); });
}

// ---------- payroll ----------
function payroll(){
  const months = [...new Set(PAYS.filter(p => p.commissionable).map(p => p.month))].sort().reverse();
  const cur = ym(today());
  if (!months.includes(cur)) months.unshift(cur);
  const rows = months.map(m => {
    const ps = PAYS.filter(p => p.month === m && p.commissionable), po = PAYOUTS.find(o => o.month === m);
    const [y, mo] = m.split("-").map(Number), pay = new Date(y, mo, 10);
    return { m, n: ps.filter(p => p.amount > 0).length, col: ps.reduce((s, p) => s + p.amount - p.refunded, 0), com: ps.reduce((s, p) => s + Number(p.commission), 0), pay, po };
  });
  $("#vPay").innerHTML = `
    <h2>עמלות ושכר</h2>
    <p class="mute">20% מכל תשלום שאומת ב-Stripe על תיק שעודכן לפני התשלום או עד 48 שעות אחריו. חודש נסגר לפי תאריך התשלום, ומשולם ב-10 לחודש שאחריו. תשלום שהוחזר או הוכחש מקוזז.</p>
    <div class="tbl"><table><tr><th>חודש</th><th>תשלומים</th><th>נגבה נטו</th><th>עמלה</th><th>מועד תשלום</th><th>סטטוס</th><th></th></tr>
    ${rows.map(r => `<tr><td>${r.m}</td><td>${r.n}</td><td>${ils(r.col)}</td><td><b>${ils(r.com)}</b></td><td>${dmy(r.pay)}</td>
      <td>${r.po ? `<span class="chip ok">שולם ${dmy(new Date(r.po.paid_at))}${r.po.ref ? " · " + esc(r.po.ref) : ""}</span>` : r.m === cur ? `<span class="chip">חודש פתוח</span>` : `<span class="chip warn">ממתין לתשלום</span>`}</td>
      <td><button class="btn" data-csv="${r.m}">פירוט CSV</button>${boss() && !r.po && r.m !== cur ? ` <button class="btn g" data-pay="${r.m}">סמן כשולם</button>` : ""}</td></tr>`).join("")}
    </table></div>
    <h3>תשלומים אחרונים</h3>
    <div class="tbl"><table><tr><th>תאריך</th><th>לקוח</th><th>סכום</th><th>הוחזר</th><th>עמלה</th><th>חודש</th></tr>
    ${PAYS.filter(p => p.commissionable).slice(0, 50).map(p => { const c = CASES.find(x => x.phone === p.phone) || {}; return `<tr><td>${dmy(new Date(p.paid_at))}</td><td>${esc(c.name || p.phone)}</td>
      <td>${ils(p.amount)}</td><td>${p.refunded ? ils(p.refunded) : ""}</td><td>${p.commissionable ? ils(p.commission) : "ללא"}</td><td>${p.month}</td></tr>`; }).join("")}</table></div>`;
  document.querySelectorAll("[data-csv]").forEach(b => b.onclick = () => csv(b.dataset.csv));
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = async () => {
    const ref = prompt("אסמכתא / מספר העברה (לא חובה)") ?? "";
    const { error } = await SB.rpc("coll_mark_payout", { p_month: b.dataset.pay, p_ref: ref });
    if (error) return toast(error.message); toast("סומן כשולם"); await load();
  });
}
function csv(m){
  const ps = PAYS.filter(p => p.month === m && p.commissionable);
  const lines = [["תאריך","לקוח","טלפון","סכום","הוחזר","נטו","עמלה","מזהה Stripe"]].concat(ps.map(p => {
    const c = CASES.find(x => x.phone === p.phone) || {};
    return [dmy(new Date(p.paid_at)), c.name || "", local(p.phone), p.amount, p.refunded, p.amount - p.refunded, p.commission, p.id];
  }));
  lines.push(["סה\"כ","","","","", ps.reduce((s, p) => s + p.amount - p.refunded, 0), ps.reduce((s, p) => s + Number(p.commission), 0), ""]);
  const blob = new Blob(["﻿" + lines.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], {type: "text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `עמלות גבייה ${m}.csv`; a.click();
}
start();
</script>
